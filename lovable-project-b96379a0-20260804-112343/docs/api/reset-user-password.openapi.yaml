openapi: 3.0.3
info:
  title: Admin — reset-user-password
  version: "1.0.0"
  description: |
    Redefine a senha de um usuário via Admin API. Requer `is_master = true`.
    Erros seguem o formato admin compartilhado (`error_code`, `message`,
    `details?`, `request_id`).

servers:
  - url: https://{project_ref}.functions.supabase.co
    variables:
      project_ref: { default: "your-project-ref" }

paths:
  /reset-user-password:
    post:
      operationId: resetUserPassword
      summary: Redefine a senha de um usuário
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Request-Id
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, password]
              additionalProperties: false
              properties:
                user_id: { type: string, format: uuid }
                password:
                  type: string
                  minLength: 8
                  description: Deve conter letras e números (mín. 8 caracteres).
      responses:
        "200":
          description: Senha redefinida
          headers:
            X-Request-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema:
                type: object
                required: [success, request_id]
                properties:
                  success: { type: boolean, enum: [true] }
                  request_id: { type: string, format: uuid }
        "400":
          description: Inválido (`invalid_params`, `invalid_json`, `weak_password`, `update_failed`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Não autenticado (`missing_authorization`, `unauthenticated`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Sem privilégio (`forbidden`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "500":
          description: Falha interna (`internal_error`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ErrorResponse:
      allOf:
        - $ref: "./_shared/errorResponse.yaml#/components/schemas/ErrorResponse"
        - type: object
          properties:
            error_code:
              type: string
              enum:
                - missing_authorization
                - unauthenticated
                - forbidden
                - invalid_params
                - invalid_json
                - weak_password
                - update_failed
                - internal_error
