openapi: 3.0.3
info:
  title: Admin — rotate-webhook-secret
  version: "1.0.0"
  description: |
    Rotaciona o segredo de webhook do tenant (via RPC `rotate_webhook_secret`)
    e invalida o cache local/remoto. Requer JWT válido; RLS restringe ao dono
    (`auth.uid()`). Erros seguem o formato admin compartilhado
    (`error_code`, `message`, `details?`, `request_id`).

servers:
  - url: https://{project_ref}.functions.supabase.co
    variables:
      project_ref: { default: "your-project-ref" }

paths:
  /rotate-webhook-secret:
    post:
      operationId: rotateWebhookSecret
      summary: Rotaciona segredo de webhook
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Request-Id
          schema: { type: string, format: uuid }
        - in: header
          name: X-Correlation-Id
          schema: { type: string }
          description: Se omitido, é derivado do `X-Request-Id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, new_secret]
              additionalProperties: false
              properties:
                provider: { type: string, minLength: 1, maxLength: 128 }
                new_secret: { type: string, minLength: 16, maxLength: 512 }
                grace_period_hours:
                  type: number
                  minimum: 0
                  maximum: 720
                  default: 24
                label: { type: string, nullable: true }
      responses:
        "200":
          description: Rotação concluída
          headers:
            X-Request-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema:
                type: object
                required: [ok, provider, id, version, request_id]
                properties:
                  ok: { type: boolean, enum: [true] }
                  provider: { type: string }
                  id: { type: string, format: uuid, nullable: true }
                  version: { type: integer, nullable: true }
                  label: { type: string, nullable: true }
                  grace_period_hours: { type: number }
                  previous_expires_at: { type: string, format: date-time, nullable: true }
                  requested_by: { type: string, format: uuid }
                  correlation_id: { type: string }
                  request_id: { type: string, format: uuid }
        "400":
          description: Inválido (`invalid_params`, `invalid_json`, `rotation_failed`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Não autenticado (`missing_authorization`, `unauthenticated`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "405":
          description: Método não suportado (`method_not_allowed`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ErrorResponse:
      allOf:
        - $ref: "./_shared/errorResponse.yaml#/components/schemas/ErrorResponse"
        - type: object
          properties:
            error_code:
              type: string
              enum:
                - missing_authorization
                - unauthenticated
                - invalid_params
                - invalid_json
                - method_not_allowed
                - rotation_failed
