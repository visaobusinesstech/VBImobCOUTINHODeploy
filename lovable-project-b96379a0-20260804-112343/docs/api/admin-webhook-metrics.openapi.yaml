                live: []
                live_total: 0
                request_id: 2a1b6f0e-77c9-4a8a-8d2c-51f0f88a0e11
            ranking_worst_cache:
              summary: sort_by=cache_hit_rate asc — piores primeiro
              value:
                period: { start: "2026-07-07T00:00:00Z", end: "2026-07-14T00:00:00Z" }
                filters: { tenant_id: null, provider: null, group_by: both }
                sample_size: 12040
                pagination:
                  limit: 100
                  offset: 0
                  total: 27
                  returned: 27
                  next_offset: null
                  has_more: false
                  sort_by: cache_hit_rate
                  sort_dir: asc
                aggregates:
