                request_id: 71e1a2b0-6c11-4f2b-8ec7-92a3ff0b7788
    BadRequest:
      description: |
        Parâmetros inválidos. `error` = `invalid_params` (schema Zod)
        ou `invalid_period` (start > end / datas inválidas).
      headers:
        X-Request-Id: { schema: { type: string, format: uuid } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            invalid_params:
              summary: Zod flatten (limit fora de faixa, provider vazio)
              value:
                error_code: invalid_params
                message: "Um ou mais parâmetros da requisição são inválidos."
                details:
                  fieldErrors:
                    limit: ["Number must be less than or equal to 500"]
                    provider: ["String must contain at least 1 character(s)"]
                  formErrors: []
                request_id: 8a9c05bb-1b23-4a4e-b0dc-9e33d54a2211
            invalid_period:
              summary: start > end
              value:
                error_code: invalid_period
                message: "Período inválido: 'start' deve ser anterior a 'end' e ambos devem ser datas válidas."
                details:
                  start: "2026-07-14T00:00:00.000Z"
                  end:   "2026-07-01T00:00:00.000Z"
                request_id: 2c1a55e9-3f7c-4c65-8dc6-6cf9a1d0aa02
    Unauthorized:
      description: |
        `missing_authorization` (sem Bearer) ou `unauthenticated`
        (token inválido/expirado). Log com `outcome=denied`.
      headers:
        X-Request-Id: { schema: { type: string, format: uuid } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            missing_authorization:
              value:
                error_code: missing_authorization
                message: "Authorization header ausente. Envie 'Bearer <access_token>'."
                request_id: 5eb1a2f0-c22a-4bcd-901a-1f4dabf0e0c1
            unauthenticated:
              value:
                error_code: unauthenticated
                message: "Access token inválido ou expirado."
                request_id: 6fc2b3e1-d33b-5cde-a12b-2f5ebcf1f1d2
    Forbidden:
      description: Usuário autenticado sem `is_master`. Log com `outcome=denied`, `reason=forbidden`.
      headers:
        X-Request-Id: { schema: { type: string, format: uuid } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            forbidden:
              value:
                error_code: forbidden
                message: "Usuário autenticado não possui privilégio de Super Admin (is_master)."
                request_id: 7fd3c4f2-e44c-6def-b23c-30f6cd02f2e3
    ServerError:
      description: Falha ao consultar `webhook_metrics`. `error_code` = `query_failed`.
      headers:
        X-Request-Id: { schema: { type: string, format: uuid } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            query_failed:
              value:
                error_code: query_failed
                message: "Falha ao consultar métricas de webhook."
                details:
                  reason: "relation \"webhook_metrics\" does not exist"
                request_id: 8fe4d503-f55d-7ef0-c34d-41f7de13f3f4
