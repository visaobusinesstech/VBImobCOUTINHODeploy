                filters: { tenant_id: null, provider: null, group_by: both }
                sample_size: 9012
                pagination:
                  limit: 100
                  offset: 0
                  total: 9
                  returned: 9
                  next_offset: null
                  has_more: false
                  sort_by: validations_total
                  sort_dir: desc
                aggregates:
                  - tenant_id: 11111111-1111-1111-1111-111111111111
                    provider: stripe
                    validations_total: 6120
                    allowed: 6112
                    denied: 8
