name: Security · SAST + Secrets + Dependency Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Varredura diária às 06:00 UTC (03:00 BRT) — pega CVEs novos em deps já instaladas
    - cron: "0 6 * * *"
  workflow_dispatch:

# Cancela runs redundantes em pushes rápidos no mesmo PR
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write   # necessário para o comentário automático no PR

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) SAST — Semgrep (SARIF + JSON para o comentário do PR)
  # ─────────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          set +e
          semgrep ci \
            --config p/ci \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --exclude 'src/test/**' \
            --exclude '**/*.test.ts' \
            --exclude '**/*.test.tsx' \
            --exclude '**/*.spec.ts' \
            --exclude 'supabase/functions/**/index.test.ts' \
            --sarif --output=semgrep.sarif \
            --json  --output=semgrep.json
          echo "SEMGREP_EXIT=$?" >> "$GITHUB_ENV"
      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload Semgrep findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Fail job on findings
        if: always()
        run: exit ${SEMGREP_EXIT:-0}

  # ─────────────────────────────────────────────────────────────
  # 2) Secret Scanning — Gitleaks (JSON report para o PR comment)
  # ─────────────────────────────────────────────────────────────
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GL_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: |
          set +e
          gitleaks detect \
            --source . \
            --redact \
            --report-format json \
            --report-path gitleaks.json \
            --exit-code 1 \
            --no-banner \
            --verbose
          echo "GITLEAKS_EXIT=$?" >> "$GITHUB_ENV"
      - name: Upload Gitleaks findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: gitleaks.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Fail job on findings
        if: always()
        run: exit ${GITLEAKS_EXIT:-0}

  # ─────────────────────────────────────────────────────────────
  # 3) Dependency Audit — npm audit + verificação explícita de jspdf
  # ─────────────────────────────────────────────────────────────
  deps:
    name: Dependency audit (npm + jspdf lockcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: npm audit (relatório completo + falha em high/critical)
        run: |
          mkdir -p reports
          # Captura o relatório completo em JSON e texto (independente do nível).
          # Falhas de rede/registry produzem stderr — não abortamos aqui.
          npm audit --json > reports/npm-audit.json  || true
          npm audit          > reports/npm-audit.txt || true
          # Reexecuta com gate estrito — este comando é o que falha o job.
          npm audit --audit-level=high

      - name: Bloqueio explícito de versão vulnerável do jspdf
        run: |
          INSTALLED=$(node -e "console.log(require('./node_modules/jspdf/package.json').version)")
          echo "jspdf instalado: $INSTALLED"
          node -e "
            const v = require('./node_modules/jspdf/package.json').version;
            const [maj, min, patch] = v.split('.').map(Number);
            const ok = maj > 4 || (maj === 4 && (min > 2 || (min === 2 && patch >= 1)));
            if (!ok) {
              console.error('❌ jspdf ' + v + ' é vulnerável (GHSA-wfv2-pwc8-crg5). Exige >= 4.2.1');
              process.exit(1);
            }
            console.log('✅ jspdf ' + v + ' está acima do piso de segurança (4.2.1)');
          "

      - name: OSV Scanner (CVE database, offline-friendly)
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            --lockfile=./package-lock.json
            --recursive
            --skip-git
            --format=sarif
            --output=reports/osv.sarif

      - name: OSV Scanner (JSON detalhado)
        if: always()
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            --lockfile=./package-lock.json
            --recursive
            --skip-git
            --format=json
            --output=reports/osv.json

      - name: Upload OSV SARIF ao GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/osv.sarif
        continue-on-error: true

      - name: Upload dependency audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            reports/npm-audit.json
            reports/npm-audit.txt
            reports/osv.sarif
            reports/osv.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Fail job se OSV encontrou vulnerabilidades
        if: always()
        run: |
          # OSV action retorna exit-code != 0 quando há achados. Consolidamos aqui
          # para que os artifacts sejam sempre publicados antes do gate final.
          if [ "${{ steps.osv.outcome }}" = "failure" ]; then
            echo "❌ OSV Scanner encontrou vulnerabilidades — veja artifact 'dependency-audit'."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # 4) PR comment — resumo dos achados de Semgrep + Gitleaks
  #    Roda mesmo que os jobs anteriores falhem. Usa marker HTML
  #    para atualizar o mesmo comentário em cada push do PR.
  # ─────────────────────────────────────────────────────────────
  pr-report:
    name: PR comment · resumo Semgrep + Gitleaks
    if: github.event_name == 'pull_request'
    needs: [sast, secrets]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download Semgrep findings
        uses: actions/download-artifact@v4
        with:
          name: semgrep-findings
          path: reports/semgrep
        continue-on-error: true
      - name: Download Gitleaks findings
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-findings
          path: reports/gitleaks
        continue-on-error: true
      - name: Build PR comment body
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const MARKER = '<!-- lovable-security-report -->';
            const MAX_ROWS = 20;

            const readJson = (p) => {
              try { return JSON.parse(fs.readFileSync(p, 'utf8')); }
              catch { return null; }
            };

            // ---------- Semgrep ----------
            const semgrepRaw = readJson('reports/semgrep/semgrep.json');
            const semgrepFindings = (semgrepRaw?.results ?? []).map(r => ({
              severity: (r.extra?.severity || 'INFO').toUpperCase(),
              rule: r.check_id,
              file: r.path,
              line: r.start?.line ?? 0,
              endLine: r.end?.line ?? r.start?.line ?? 0,
              message: (r.extra?.message || '').split('\n')[0].slice(0, 220),
            }));
            const sevRank = { ERROR: 0, HIGH: 0, WARNING: 1, MEDIUM: 1, INFO: 2, LOW: 2 };
            semgrepFindings.sort((a, b) =>
              (sevRank[a.severity] ?? 3) - (sevRank[b.severity] ?? 3) ||
              a.file.localeCompare(b.file) || a.line - b.line
            );
            const semgrepBySev = semgrepFindings.reduce((acc, f) => {
              acc[f.severity] = (acc[f.severity] || 0) + 1; return acc;
            }, {});

            // ---------- Gitleaks ----------
            const gitleaksRaw = readJson('reports/gitleaks/gitleaks.json') || [];
            const gitleaksFindings = gitleaksRaw.map(g => ({
              rule: g.RuleID || g.Description || 'secret',
              file: g.File || '(unknown)',
              line: g.StartLine || 0,
              endLine: g.EndLine || g.StartLine || 0,
              commit: (g.Commit || '').slice(0, 7),
              secret: g.Secret ? '`' + String(g.Secret).slice(0, 40) + '…`' : '_(redacted)_',
            }));

            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const linkTo = (file, line) =>
              `[\`${file}:${line}\`](${repoUrl}/blob/${sha}/${encodeURI(file)}#L${line})`;

            const table = (rows, header) => {
              if (!rows.length) return '_Sem achados._';
              const truncated = rows.length > MAX_ROWS;
              const shown = rows.slice(0, MAX_ROWS);
              const body = [header, '|' + '---|'.repeat(header.split('|').length - 2)]
                .concat(shown).join('\n');
              return truncated
                ? `${body}\n\n_+${rows.length - MAX_ROWS} achados omitidos — veja o artifact completo._`
                : body;
            };

            const semgrepTable = table(
              semgrepFindings.map(f =>
                `| ${f.severity} | \`${f.rule.split('.').pop()}\` | ${linkTo(f.file, f.line)} | ${f.message.replace(/\|/g, '\\|')} |`
              ),
              '| Sev | Regra | Local | Mensagem |'
            );

            const gitleaksTable = table(
              gitleaksFindings.map(g =>
                `| \`${g.rule}\` | ${linkTo(g.file, g.line)} | ${g.commit || '_working tree_'} | ${g.secret} |`
              ),
              '| Regra | Local | Commit | Segredo |'
            );

            const total = semgrepFindings.length + gitleaksFindings.length;
            const badge = total === 0 ? '✅ **Sem achados de segurança.**'
              : `⚠️ **${total} achado(s)** — Semgrep: ${semgrepFindings.length} · Gitleaks: ${gitleaksFindings.length}`;

            const sevSummary = Object.entries(semgrepBySev)
              .map(([k, v]) => `${k}: **${v}**`).join(' · ') || '—';

            const body = [
              MARKER,
              '## 🔐 Relatório de segurança do PR',
              '',
              badge,
              '',
              `<sub>Run: [#${context.runNumber}](${repoUrl}/actions/runs/${context.runId}) · commit \`${sha.slice(0,7)}\`</sub>`,
              '',
              '### Semgrep (SAST)',
              `Severidades: ${sevSummary}`,
              '',
              semgrepTable,
              '',
              '### Gitleaks (segredos)',
              '',
              gitleaksTable,
              '',
              '<sub>Comentário atualizado automaticamente a cada push. Artifacts completos disponíveis no run acima.</sub>',
            ].join('\n');

            core.setOutput('body', body);
            core.setOutput('marker', MARKER);
      - name: Upsert sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = `${{ steps.build.outputs.marker }}`;
            const body = ${{ toJSON(steps.build.outputs.body) }};
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated comment #${existing.id}`);
            } else {
              const { data } = await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info(`Created comment #${data.id}`);
            }
