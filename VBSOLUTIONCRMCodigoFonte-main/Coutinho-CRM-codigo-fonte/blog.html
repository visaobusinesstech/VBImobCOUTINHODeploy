<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Radar Imob Tech · Mercado Imobiliário DF</title>
<meta name="description" content="Guias, análises e tendências do mercado imobiliário do Distrito Federal. Conteúdo especializado da Coutinho Imóveis.">
<meta property="og:title" content="Blog Radar Imob Tech · Mercado Imobiliário DF">
<meta property="og:description" content="Guias e análises do mercado imobiliário do DF.">
<meta property="og:type" content="website">
<link rel="canonical" href="/blog.html">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  .prose h1 { font-size: 2rem; font-weight: 800; color: #0b1d3a; margin: 1.5rem 0 1rem; }
  .prose h2 { font-size: 1.4rem; font-weight: 700; color: #0b1d3a; margin: 1.5rem 0 0.5rem; }
  .prose h3 { font-size: 1.15rem; font-weight: 600; color: #1e293b; margin: 1rem 0 0.5rem; }
  .prose p { margin: 0.75rem 0; line-height: 1.75; color: #334155; }
  .prose strong { color: #0b1d3a; }
  .prose ul { list-style: disc; padding-left: 1.5rem; margin: 0.75rem 0; }
  .prose li { margin: 0.25rem 0; }
  .prose a { color: #0891b2; text-decoration: underline; }
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/blog.html" class="flex items-center gap-2">
      <span class="w-8 h-8 rounded-lg bg-amber-400 text-slate-950 flex items-center justify-center font-black">C</span>
      <span class="font-bold text-slate-900">Coutinho <span class="text-amber-500">Blog</span></span>
    </a>
    <div class="flex items-center gap-3 text-sm">
      <a href="#/imoveis" class="text-slate-600 hover:text-slate-900 font-semibold hidden sm:inline">Imóveis</a>
      <a id="wa-nav" href="#" target="_blank" class="bg-emerald-500 text-white px-3 py-1.5 rounded-lg font-bold text-xs hover:bg-emerald-600">WhatsApp</a>
    </div>
  </div>
</nav>

<div id="blog-app" class="max-w-6xl mx-auto px-4 py-8"></div>

<footer class="bg-slate-900 text-slate-300 mt-16">
  <div class="max-w-6xl mx-auto px-4 py-8 text-sm text-center">
    <p class="font-bold text-white mb-1" id="footer-name">Coutinho Imóveis</p>
    <p class="text-xs" id="footer-address">Brasília — DF</p>
    <p class="text-[11px] mt-3 text-slate-500">© <span id="year"></span> · Todos os direitos reservados · Powered by <strong class="text-amber-400">Radar Imob Tech</strong></p>
  </div>
</footer>

<script type="module">
  const STORAGE_KEY = 'coutinho_crm_database_v5';
  let db = {};
  try { db = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) {}
  const settings = db.settings || { tradingName: 'Coutinho Imóveis', address: 'Brasília — DF', whatsapp: '61999999999' };
  const posts = (db.blogPosts || []).filter(p => p.status === 'PUBLICADO');
  const app = document.getElementById('blog-app');

  document.getElementById('footer-name').textContent = settings.tradingName || 'Coutinho Imóveis';
  document.getElementById('footer-address').textContent = settings.address || 'Brasília — DF';
  document.getElementById('year').textContent = new Date().getFullYear();
  const waPhone = (settings.whatsapp || '61999999999').replace(/\D/g, '');
  document.getElementById('wa-nav').href = `https://wa.me/55${waPhone}?text=${encodeURIComponent('Olá! Vim pelo blog e gostaria de mais informações.')}`;

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function formatDate(iso) { return iso ? new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) : ''; }
  function readingTime(content) { const words = (content || '').trim().split(/\s+/).length; return Math.max(1, Math.round(words / 200)); }
  function renderMarkdown(md) {
    return escapeHtml(md || '')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/^(?!<h)(.+)$/gm, function(m) { return m.startsWith('<') ? m : '<p>' + m + '</p>'; });
  }

  function renderList() {
    if (!posts.length) {
      app.innerHTML = `
        <div class="bg-white border border-slate-200 rounded-2xl p-12 text-center">
          <h1 class="text-2xl font-bold text-slate-900 mb-2">Nenhum artigo publicado</h1>
          <p class="text-slate-500 text-sm">Assim que a equipe publicar novos conteúdos, eles aparecerão aqui.</p>
        </div>`;
      return;
    }

    const featured = posts[0];
    const rest = posts.slice(1);

    app.innerHTML = `
      <header class="mb-10">
        <p class="text-xs font-bold text-amber-600 uppercase tracking-wider">Radar Imob Tech · Blog</p>
        <h1 class="text-3xl md:text-4xl font-black text-slate-900 mt-2">Mercado imobiliário do DF, sem enrolação</h1>
        <p class="text-slate-500 text-sm mt-3 max-w-2xl">Guias práticos, análises de bairros e tendências para quem quer comprar, vender ou investir em imóveis em Brasília.</p>
      </header>

      <article class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white rounded-2xl p-8 mb-10 shadow-lg cursor-pointer hover:shadow-xl transition" data-slug="${escapeHtml(featured.slug)}">
        <span class="text-[10px] font-bold bg-amber-400 text-slate-950 px-2 py-0.5 rounded uppercase tracking-wider">Em destaque · ${escapeHtml(featured.category || 'Blog')}</span>
        <h2 class="text-2xl md:text-3xl font-black mt-3 leading-tight">${escapeHtml(featured.title)}</h2>
        <p class="text-indigo-100 mt-3 text-sm">${escapeHtml(featured.metaDescription || '')}</p>
        <div class="mt-4 flex items-center gap-3 text-xs text-indigo-200">
          <span>Por ${escapeHtml(featured.author || 'Coutinho')}</span>
          <span>·</span><span>${formatDate(featured.createdAt)}</span>
          <span>·</span><span>${readingTime(featured.content)} min de leitura</span>
        </div>
      </article>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        ${rest.map(p => `
          <article class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md transition cursor-pointer" data-slug="${escapeHtml(p.slug)}">
            <span class="text-[10px] font-bold text-indigo-700 uppercase tracking-wider">${escapeHtml(p.category || 'Blog')}</span>
            <h3 class="font-bold text-slate-900 mt-1 leading-snug">${escapeHtml(p.title)}</h3>
            <p class="text-xs text-slate-500 mt-2 line-clamp-3">${escapeHtml(p.metaDescription || '')}</p>
            <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
              <span>${escapeHtml(p.author || 'Coutinho')}</span>
              <span>${formatDate(p.createdAt)} · ${readingTime(p.content)} min</span>
            </div>
          </article>
        `).join('')}
      </div>
    `;

    app.querySelectorAll('[data-slug]').forEach(el => {
      el.addEventListener('click', () => { window.location.hash = '#/' + el.getAttribute('data-slug'); });
    });
  }

  function renderPost(slug) {
    const post = posts.find(p => p.slug === slug);
    if (!post) { window.location.hash = ''; renderList(); return; }

    document.title = (post.seoTitle || post.title) + ' · Coutinho Blog';
    const bodyHtml = renderMarkdown(post.content || '');
    const related = posts.filter(p => p.slug !== slug && p.category === post.category).slice(0, 3);
    const waMsg = `Olá! Li o artigo "${post.title}" e gostaria de mais informações.`;
    const waLink = `https://wa.me/55${waPhone}?text=${encodeURIComponent(waMsg)}`;

    const properties = (db.properties || []).filter(p => p.status === 'DISPONIVEL').slice(0, 3);

    app.innerHTML = `
      <button id="back-btn" class="text-sm font-bold text-indigo-600 hover:text-indigo-800 mb-4">← Voltar para o blog</button>

      <article class="bg-white rounded-2xl p-6 md:p-10 shadow-sm border border-slate-200">
        <div class="max-w-3xl mx-auto">
          <span class="text-[10px] font-bold text-indigo-700 uppercase tracking-wider">${escapeHtml(post.category || 'Blog')}</span>
          <h1 class="text-3xl md:text-4xl font-black text-slate-900 mt-2 leading-tight">${escapeHtml(post.title)}</h1>
          <div class="mt-4 flex items-center gap-3 text-xs text-slate-500 border-b border-slate-100 pb-4">
            <span>Por <strong class="text-slate-800">${escapeHtml(post.author || 'Coutinho')}</strong></span>
            <span>·</span><span>${formatDate(post.createdAt)}</span>
            <span>·</span><span>${readingTime(post.content)} min de leitura</span>
          </div>

          <div class="prose mt-6">${bodyHtml}</div>

          ${Array.isArray(post.faq) && post.faq.length ? `
            <section class="mt-10 pt-6 border-t border-slate-200">
              <h2 class="text-xl font-bold text-slate-900 mb-4">Perguntas frequentes</h2>
              <div class="space-y-3">
                ${post.faq.map(f => `
                  <details class="border border-slate-200 rounded-xl p-4 bg-slate-50">
                    <summary class="font-bold text-slate-900 cursor-pointer">${escapeHtml(f.q)}</summary>
                    <p class="text-sm text-slate-700 mt-2">${escapeHtml(f.a)}</p>
                  </details>
                `).join('')}
              </div>
            </section>` : ''}

          <section class="mt-10 pt-6 border-t border-slate-200 bg-emerald-50 -mx-6 md:-mx-10 -mb-6 md:-mb-10 p-6 md:p-10 rounded-b-2xl">
            <h2 class="text-2xl font-black text-slate-900">Quer receber imóveis dentro do seu orçamento?</h2>
            <p class="text-sm text-slate-600 mt-2">Deixe seu contato. Um corretor especializado retorna em até 1 hora útil.</p>

            <form id="lead-form" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
              <input type="text" name="name" required placeholder="Seu nome" class="p-3 border rounded-lg">
              <input type="tel" name="phone" required placeholder="WhatsApp com DDD" class="p-3 border rounded-lg">
              <input type="email" name="email" placeholder="E-mail (opcional)" class="p-3 border rounded-lg">
              <input type="text" name="region" placeholder="Região de interesse" class="p-3 border rounded-lg">
              <textarea name="message" placeholder="Deixe uma mensagem" rows="2" class="p-3 border rounded-lg md:col-span-2"></textarea>
              <button type="submit" class="md:col-span-2 bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700">
                Quero ser contatado por um corretor
              </button>
            </form>
            <p id="lead-feedback" class="text-sm text-emerald-800 mt-2 font-bold hidden">Contato recebido! Falamos em breve.</p>

            <div class="mt-6 pt-6 border-t border-emerald-200 flex flex-col sm:flex-row items-center justify-between gap-3">
              <span class="text-xs text-slate-600">Ou fale direto no WhatsApp:</span>
              <a href="${waLink}" target="_blank" class="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-lg hover:bg-emerald-700 text-sm">
                Abrir WhatsApp
              </a>
            </div>
          </section>
        </div>
      </article>

      ${properties.length ? `
        <section class="mt-10">
          <h2 class="text-xl font-bold text-slate-900 mb-4">Imóveis disponíveis relacionados</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${properties.map(pr => `
              <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                <div class="text-[10px] font-bold text-indigo-700 uppercase">${escapeHtml(pr.region || 'DF')} · ${escapeHtml(pr.type || '')}</div>
                <h3 class="font-bold text-slate-900 mt-1 line-clamp-2 text-sm">${escapeHtml(pr.title || '')}</h3>
                <div class="mt-2 text-lg font-black text-emerald-600">${pr.salePrice ? 'R$ ' + Number(pr.salePrice).toLocaleString('pt-BR') : 'Consulte'}</div>
                <div class="text-[11px] text-slate-500 mt-1">${pr.bedrooms || 0} quartos · ${pr.area || '?'}m² · ${pr.parkingSpots || 0} vagas</div>
              </div>
            `).join('')}
          </div>
        </section>` : ''}

      ${related.length ? `
        <section class="mt-10">
          <h2 class="text-xl font-bold text-slate-900 mb-4">Leia também</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${related.map(r => `
              <article class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:shadow-md cursor-pointer" data-slug="${escapeHtml(r.slug)}">
                <span class="text-[10px] font-bold text-indigo-700 uppercase">${escapeHtml(r.category || '')}</span>
                <h3 class="font-bold text-slate-900 mt-1 text-sm line-clamp-2">${escapeHtml(r.title)}</h3>
              </article>
            `).join('')}
          </div>
        </section>` : ''}
    `;

    document.getElementById('back-btn').addEventListener('click', () => { window.location.hash = ''; renderList(); });
    app.querySelectorAll('[data-slug]').forEach(el => el.addEventListener('click', () => { window.location.hash = '#/' + el.getAttribute('data-slug'); }));

    document.getElementById('lead-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.currentTarget);
      const clients = db.clients || [];
      const phone = (fd.get('phone') || '').toString();
      const newLead = {
        id: 'cli_blog_' + Date.now(),
        name: fd.get('name'),
        type: 'LEAD',
        email: fd.get('email') || '',
        phone: phone,
        whatsapp: phone.replace(/\D/g, ''),
        interestRegion: fd.get('region') || '',
        propertyType: 'APARTAMENTO',
        temperature: 'QUENTE',
        leadSource: 'BLOG_' + (post.slug || '').toUpperCase().slice(0, 30),
        notes: `Origem: artigo "${post.title}". Mensagem: ${fd.get('message') || 'N/A'}`,
        status: 'ATIVO',
        lastContactAt: new Date().toISOString(),
        createdAt: new Date().toISOString()
      };
      clients.push(newLead);
      db.clients = clients;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(err) {}

      document.getElementById('lead-feedback').classList.remove('hidden');
      e.currentTarget.reset();
      window.scrollTo({ top: document.getElementById('lead-feedback').offsetTop - 80, behavior: 'smooth' });
    });

    // Incrementa views
    post.views = (post.views || 0) + 1;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(err) {}
  }

  function route() {
    const slug = (window.location.hash || '').replace(/^#\//, '').trim();
    if (!slug) renderList();
    else renderPost(slug);
    window.scrollTo({ top: 0 });
  }

  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
