name: RLS Multi-Tenant Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run RLS suite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TEST_TENANT_A_EMAIL: ${{ secrets.TEST_TENANT_A_EMAIL }}
          TEST_TENANT_A_PASSWORD: ${{ secrets.TEST_TENANT_A_PASSWORD }}
          TEST_TENANT_B_EMAIL: ${{ secrets.TEST_TENANT_B_EMAIL }}
          TEST_TENANT_B_PASSWORD: ${{ secrets.TEST_TENANT_B_PASSWORD }}
        run: bunx vitest run src/test/rls
